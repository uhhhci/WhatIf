<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1250" width="900" height="1250" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>What If model pipeline</title>
  <desc>From the user's voice to the scene: voice gate, Whisper, the Qwen planner with the headset's sensors, Stable Audio Open for sounds, the CLIP object library, SDXL-Turbo, BiRefNet and CLIP for the picture, the decision between a downloaded Objaverse model (checked by CLIP and the vision model, ranked by likes) and SPAR3D, then placement on the headset with floor shadows from the light estimation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="#5F5E5A"/>
    </marker>
  </defs>
  <rect width="900" height="1250" fill="#FFFFFF"/>

  <!-- user -->
  <rect x="300" y="30" width="300" height="46" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.2"/>
  <text x="450" y="59" font-size="17" font-weight="600" fill="#633806" text-anchor="middle">User speaks</text>

  <!-- headset: voice -->
  <rect x="300" y="100" width="300" height="64" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
  <text x="450" y="126" font-size="17" font-weight="600" fill="#085041" text-anchor="middle">Microphone + voice gate</text>
  <text x="450" y="149" font-size="14" fill="#0F6E56" text-anchor="middle">Only the user's voice; no model</text>

  <!-- server -->
  <rect x="300" y="190" width="300" height="64" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
  <text x="450" y="216" font-size="17" font-weight="600" fill="#3C3489" text-anchor="middle">Whisper large-v3-turbo</text>
  <text x="450" y="239" font-size="14" fill="#534AB7" text-anchor="middle">Speech to text, English and German</text>

  <rect x="40" y="280" width="210" height="64" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
  <text x="145" y="306" font-size="17" font-weight="600" fill="#085041" text-anchor="middle">Headset sensors</text>
  <text x="145" y="329" font-size="14" fill="#0F6E56" text-anchor="middle">Camera, planes, mesh, gaze</text>

  <rect x="300" y="280" width="300" height="64" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
  <text x="450" y="306" font-size="17" font-weight="600" fill="#3C3489" text-anchor="middle">Qwen3.5-35B-A3B planner</text>
  <text x="450" y="329" font-size="14" fill="#534AB7" text-anchor="middle">Wish + picture to plan, streamed</text>

  <rect x="650" y="280" width="210" height="64" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
  <text x="755" y="306" font-size="17" font-weight="600" fill="#3C3489" text-anchor="middle">Stable Audio Open</text>
  <text x="755" y="329" font-size="14" fill="#534AB7" text-anchor="middle">Ambience (places), sounds</text>

  <!-- library -->
  <polygon points="450,372 570,410 450,448 330,410" fill="#FFFFFF" stroke="#534AB7" stroke-width="1.5"/>
  <text x="450" y="405" font-size="15" font-weight="600" fill="#3C3489" text-anchor="middle">Already in the</text>
  <text x="450" y="423" font-size="15" font-weight="600" fill="#3C3489" text-anchor="middle">library? (CLIP)</text>

  <rect x="650" y="380" width="170" height="64" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
  <text x="735" y="406" font-size="17" font-weight="600" fill="#3C3489" text-anchor="middle">Reuse it</text>
  <text x="735" y="429" font-size="14" fill="#534AB7" text-anchor="middle">Downloaded or filler</text>

  <!-- picture -->
  <rect x="300" y="476" width="300" height="64" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
  <text x="450" y="502" font-size="17" font-weight="600" fill="#3C3489" text-anchor="middle">SDXL-Turbo</text>
  <text x="450" y="525" font-size="14" fill="#534AB7" text-anchor="middle">Text to picture, 4 candidates</text>

  <rect x="300" y="566" width="300" height="64" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
  <text x="450" y="592" font-size="17" font-weight="600" fill="#3C3489" text-anchor="middle">BiRefNet</text>
  <text x="450" y="615" font-size="14" fill="#534AB7" text-anchor="middle">Cuts out the object</text>

  <rect x="300" y="656" width="300" height="64" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
  <text x="450" y="682" font-size="17" font-weight="600" fill="#3C3489" text-anchor="middle">CLIP ViT-B/32</text>
  <text x="450" y="705" font-size="14" fill="#534AB7" text-anchor="middle">Picks the best picture</text>

  <!-- download or generate -->
  <polygon points="450,748 570,786 450,824 330,786" fill="#FFFFFF" stroke="#534AB7" stroke-width="1.5"/>
  <text x="450" y="781" font-size="15" font-weight="600" fill="#3C3489" text-anchor="middle">Real model</text>
  <text x="450" y="799" font-size="15" font-weight="600" fill="#3C3489" text-anchor="middle">fits?</text>

  <rect x="20" y="730" width="250" height="150" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
  <text x="145" y="758" font-size="17" font-weight="600" fill="#3C3489" text-anchor="middle">Objaverse download</text>
  <text x="38" y="784" font-size="14" fill="#534AB7">Searched by name, ranked by likes</text>
  <text x="38" y="806" font-size="14" fill="#534AB7">CLIP: looks like the picture</text>
  <text x="38" y="828" font-size="14" fill="#534AB7">Qwen: right thing, well made</text>
  <text x="38" y="850" font-size="14" fill="#534AB7">Made static, turned to face</text>
  <text x="38" y="868" font-size="14" fill="#534AB7">forward, materials fixed</text>

  <rect x="300" y="852" width="300" height="64" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
  <text x="450" y="878" font-size="17" font-weight="600" fill="#3C3489" text-anchor="middle">SPAR3D</text>
  <text x="450" y="901" font-size="14" fill="#534AB7" text-anchor="middle">Picture to 3D model</text>

  <!-- headset: scene -->
  <rect x="300" y="964" width="300" height="84" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
  <text x="450" y="990" font-size="17" font-weight="600" fill="#085041" text-anchor="middle">Placement on the headset</text>
  <text x="450" y="1013" font-size="14" fill="#0F6E56" text-anchor="middle">Planes, mesh, depth camera, walls</text>
  <text x="450" y="1034" font-size="14" fill="#0F6E56" text-anchor="middle">Floor shadows from light estimation</text>

  <rect x="300" y="1074" width="300" height="64" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.2"/>
  <text x="450" y="1100" font-size="17" font-weight="600" fill="#633806" text-anchor="middle">User's scene</text>
  <text x="450" y="1123" font-size="14" fill="#854F0B" text-anchor="middle">Grab and throw by hand, edit by voice</text>

  <!-- flow -->
  <g stroke="#5F5E5A" stroke-width="2" fill="none">
    <line x1="450" y1="76" x2="450" y2="96" marker-end="url(#arrow)"/>
    <line x1="450" y1="164" x2="450" y2="186" marker-end="url(#arrow)"/>
    <line x1="450" y1="254" x2="450" y2="276" marker-end="url(#arrow)"/>
    <line x1="250" y1="312" x2="296" y2="312" marker-end="url(#arrow)"/>
    <line x1="600" y1="312" x2="646" y2="312" marker-end="url(#arrow)"/>
    <line x1="450" y1="344" x2="450" y2="368" marker-end="url(#arrow)"/>
    <line x1="570" y1="410" x2="646" y2="410" marker-end="url(#arrow)"/>
    <line x1="450" y1="448" x2="450" y2="472" marker-end="url(#arrow)"/>
    <line x1="450" y1="540" x2="450" y2="562" marker-end="url(#arrow)"/>
    <line x1="450" y1="630" x2="450" y2="652" marker-end="url(#arrow)"/>
    <line x1="450" y1="720" x2="450" y2="744" marker-end="url(#arrow)"/>
    <line x1="330" y1="786" x2="274" y2="786" marker-end="url(#arrow)"/>
    <line x1="450" y1="824" x2="450" y2="848" marker-end="url(#arrow)"/>
    <line x1="450" y1="916" x2="450" y2="960" marker-end="url(#arrow)"/>
    <path d="M145 880 L145 996 L296 996" marker-end="url(#arrow)"/>
    <path d="M735 444 L735 996 L604 996" marker-end="url(#arrow)"/>
    <path d="M845 344 L845 1020 L604 1020" marker-end="url(#arrow)"/>
    <line x1="450" y1="1048" x2="450" y2="1070" marker-end="url(#arrow)"/>
  </g>
  <text x="608" y="401" font-size="14" font-weight="600" fill="#5F5E5A" text-anchor="middle">yes</text>
  <text x="464" y="464" font-size="14" font-weight="600" fill="#5F5E5A">no</text>
  <text x="300" y="777" font-size="14" font-weight="600" fill="#5F5E5A" text-anchor="middle">yes</text>
  <text x="464" y="840" font-size="14" font-weight="600" fill="#5F5E5A">no</text>

  <!-- legend -->
  <rect x="245" y="1180" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="266" y="1192" font-size="14" fill="#444441">Magic Leap 2 headset</text>
  <rect x="460" y="1180" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="481" y="1192" font-size="14" fill="#444441">Model on the GPU server</text>
</svg>
