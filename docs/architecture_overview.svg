<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>What If system overview</title>
  <desc>The user speaks; the Magic Leap 2 headset's microphone and camera pick up the speech and the room. A GPU server understands the speech, plans the scene, then for each object makes a picture, downloads a real 3D model if one fits or turns the picture into 3D, and creates sounds. The headset builds the scene in the real room, where the user sees it, grabs it and changes it by voice.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="#5F5E5A"/>
    </marker>
  </defs>

  <rect width="1200" height="640" fill="#FFFFFF"/>

  <!-- ===================== you ===================== -->
  <rect x="20" y="80" width="120" height="506" rx="16" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.2"/>
  <g transform="translate(80 316)" stroke="#854F0B" stroke-width="2.6" fill="none" stroke-linecap="round">
    <circle cx="0" cy="-14" r="11"/><path d="M-20 22 a20 17 0 0 1 40 0"/>
  </g>
  <text x="80" y="370" font-size="22" font-weight="600" fill="#633806" text-anchor="middle">User</text>

  <!-- ===================== headset ===================== -->
  <rect x="190" y="20" width="300" height="600" rx="22" fill="#F3FBF8" stroke="#5DCAA5" stroke-width="1.5"/>
  <g stroke="#0F6E56" stroke-width="2" fill="none" stroke-linecap="round">
    <circle cx="224" cy="50" r="8"/><circle cx="246" cy="50" r="8"/><path d="M232 50 h6 M216 50 h-5 M254 50 h5"/>
  </g>
  <text x="268" y="57" font-size="19" font-weight="600" fill="#085041">Magic Leap 2 headset</text>

  <!-- Listen -->
  <rect x="210" y="80" width="260" height="96" rx="14" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
  <g transform="translate(250 128)" stroke="#0F6E56" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-7" y="-19" width="14" height="24" rx="7"/>
    <path d="M-13 -3 a13 13 0 0 0 26 0"/><path d="M0 10 v8 M-7 18 h14"/>
  </g>
  <text x="290" y="120" font-size="20" font-weight="600" fill="#085041">Microphone</text>
  <text x="290" y="146" font-size="16" fill="#0F6E56">Hears only the user</text>

  <!-- Look -->
  <rect x="210" y="210" width="260" height="96" rx="14" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
  <g transform="translate(250 258)" stroke="#0F6E56" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-18 -8 h8 l4 -6 h12 l4 6 h8 a2 2 0 0 1 2 2 v18 a2 2 0 0 1 -2 2 h-36 a2 2 0 0 1 -2 -2 v-18 a2 2 0 0 1 2 -2 z"/>
    <circle cx="0" cy="3" r="7"/>
  </g>
  <text x="290" y="250" font-size="20" font-weight="600" fill="#085041">Camera &amp; sensors</text>
  <text x="290" y="276" font-size="16" fill="#0F6E56">Room scan, gaze, light</text>

  <!-- Build the scene -->
  <rect x="210" y="490" width="260" height="96" rx="14" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
  <g transform="translate(250 538)" stroke="#0F6E56" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 -17 L15 -9 L15 8 L0 16 L-15 8 L-15 -9 Z"/><path d="M-15 -9 L0 -1 L15 -9 M0 -1 V16"/>
  </g>
  <text x="290" y="530" font-size="20" font-weight="600" fill="#085041">Build the scene</text>
  <text x="290" y="556" font-size="16" fill="#0F6E56">Fits the real room</text>

  <!-- ===================== server ===================== -->
  <rect x="540" y="20" width="640" height="600" rx="22" fill="#F8F7FF" stroke="#AFA9EC" stroke-width="1.5"/>
  <g stroke="#534AB7" stroke-width="2" fill="none" stroke-linecap="round">
    <rect x="562" y="36" width="28" height="28" rx="3"/><path d="M568 45 h16 M568 55 h16"/>
  </g>
  <text x="604" y="57" font-size="19" font-weight="600" fill="#3C3489">GPU server</text>

  <!-- Understand -->
  <rect x="570" y="80" width="270" height="96" rx="14" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
  <g transform="translate(610 126)" stroke="#534AB7" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-16 -15 h32 a4 4 0 0 1 4 4 v17 a4 4 0 0 1 -4 4 h-18 l-8 8 v-8 h-6 a4 4 0 0 1 -4 -4 v-17 a4 4 0 0 1 4 -4 z"/>
    <path d="M-11 -6 h22 M-11 1 h14"/>
  </g>
  <text x="652" y="120" font-size="20" font-weight="600" fill="#3C3489">Understand</text>
  <text x="652" y="146" font-size="16" fill="#534AB7">Speech becomes text</text>

  <!-- Imagine & plan -->
  <rect x="880" y="80" width="270" height="96" rx="14" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
  <g transform="translate(920 126)" stroke="#534AB7" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-6 9 v-3 a12 12 0 1 1 12 0 v3 z"/><path d="M-5 14 h10 M-3 19 h6"/>
    <path d="M0 -21 v-3 M-15 -15 l-2 -2 M15 -15 l2 -2"/>
  </g>
  <text x="962" y="120" font-size="20" font-weight="600" fill="#3C3489">Imagine &amp; plan</text>
  <text x="962" y="146" font-size="16" fill="#534AB7">What, how many, where</text>

  <!-- 3D objects: download or generate -->
  <rect x="570" y="250" width="580" height="200" rx="14" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
  <g transform="translate(594 278)" stroke="#534AB7" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 -12 L11 -6 L11 6 L0 12 L-11 6 L-11 -6 Z"/><path d="M-11 -6 L0 0 L11 -6 M0 0 V12"/>
  </g>
  <text x="614" y="285" font-size="20" font-weight="600" fill="#3C3489">3D objects</text>

  <!-- picture first -->
  <rect x="590" y="322" width="112" height="86" rx="10" fill="#FFFFFF" stroke="#AFA9EC" stroke-width="1.2"/>
  <g transform="translate(646 352)" stroke="#534AB7" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-17" y="-13" width="34" height="26" rx="3"/><circle cx="8" cy="-5" r="3.5"/>
    <path d="M-17 9 L-6 -2 L4 8 L9 3 L17 11"/>
  </g>
  <text x="646" y="394" font-size="15" font-weight="600" fill="#3C3489" text-anchor="middle">AI picture</text>

  <!-- decision -->
  <polygon points="800,322 872,365 800,408 728,365" fill="#FFFFFF" stroke="#534AB7" stroke-width="1.5"/>
  <text x="800" y="360" font-size="16" font-weight="600" fill="#3C3489" text-anchor="middle">Real model</text>
  <text x="800" y="379" font-size="16" font-weight="600" fill="#3C3489" text-anchor="middle">fits?</text>
  <text x="730" y="440" font-size="15" fill="#534AB7" text-anchor="middle">Known objects are reused</text>

  <!-- download -->
  <rect x="912" y="296" width="222" height="60" rx="10" fill="#FFFFFF" stroke="#AFA9EC" stroke-width="1.2"/>
  <g transform="translate(940 326)" stroke="#534AB7" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 -14 V5 M-8 -3 L0 5 L8 -3 M-14 9 V14 H14 V9"/>
  </g>
  <text x="966" y="321" font-size="18" font-weight="600" fill="#3C3489">Download it</text>
  <text x="966" y="344" font-size="15" fill="#534AB7">Real 3D model</text>

  <!-- generate -->
  <rect x="912" y="376" width="222" height="60" rx="10" fill="#FFFFFF" stroke="#AFA9EC" stroke-width="1.2"/>
  <g transform="translate(940 406)" stroke="#534AB7" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-3 -14 Q-1 -3 10 -1 Q-1 1 -3 12 Q-5 1 -16 -1 Q-5 -3 -3 -14 Z"/>
    <path d="M10 -15 v8 M6 -11 h8"/>
  </g>
  <text x="966" y="401" font-size="18" font-weight="600" fill="#3C3489">Generate it</text>
  <text x="966" y="424" font-size="15" fill="#534AB7">3D from the picture</text>

  <g stroke="#5F5E5A" stroke-width="2" fill="none">
    <line x1="702" y1="365" x2="724" y2="365" marker-end="url(#arrow)"/>
    <path d="M872 365 L892 365 L892 326 L908 326" marker-end="url(#arrow)"/>
    <path d="M892 365 L892 406 L908 406" marker-end="url(#arrow)"/>
  </g>
  <text x="882" y="316" font-size="15" font-weight="600" fill="#5F5E5A" text-anchor="middle">yes</text>
  <text x="882" y="428" font-size="15" font-weight="600" fill="#5F5E5A" text-anchor="middle">no</text>

  <!-- Create sounds -->
  <rect x="570" y="490" width="580" height="96" rx="14" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
  <g transform="translate(610 538)" stroke="#534AB7" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-17 -6 h8 l10 -9 v30 l-10 -9 h-8 z"/>
    <path d="M6 -6 a8 8 0 0 1 0 12 M10 -12 a15 15 0 0 1 0 24"/>
  </g>
  <text x="652" y="530" font-size="20" font-weight="600" fill="#3C3489">Create sounds</text>
  <text x="652" y="556" font-size="16" fill="#534AB7">Ambience and object sounds</text>

  <!-- ===================== flow ===================== -->
  <g stroke="#5F5E5A" stroke-width="2" fill="none">
    <line x1="140" y1="128" x2="206" y2="128" marker-end="url(#arrow)"/>
    <line x1="470" y1="128" x2="566" y2="128" marker-end="url(#arrow)"/>
    <line x1="840" y1="128" x2="876" y2="128" marker-end="url(#arrow)"/>
    <path d="M470 232 L960 232 L960 180" marker-end="url(#arrow)"/>
    <line x1="340" y1="306" x2="340" y2="486" marker-end="url(#arrow)"/>
    <line x1="1080" y1="176" x2="1080" y2="246" marker-end="url(#arrow)"/>
    <path d="M1150 128 L1166 128 L1166 538 L1154 538" marker-end="url(#arrow)"/>
    <path d="M570 365 L515 365 L515 520 L474 520" marker-end="url(#arrow)"/>
    <line x1="570" y1="550" x2="474" y2="550" marker-end="url(#arrow)"/>
    <line x1="144" y1="538" x2="206" y2="538" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <text x="173" y="117" font-size="15" fill="#5F5E5A" text-anchor="middle">speaks</text>
  <text x="173" y="510" font-size="15" fill="#5F5E5A" text-anchor="middle">sees,</text>
  <text x="173" y="528" font-size="15" fill="#5F5E5A" text-anchor="middle">grabs</text>
  <text x="715" y="223" font-size="15" fill="#5F5E5A" text-anchor="middle">camera picture and room</text>
</svg>
